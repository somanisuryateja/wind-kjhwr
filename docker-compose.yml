services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-forecast-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind-forecast-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
