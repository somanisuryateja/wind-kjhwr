# Reference copy of the nginx site on the Oracle VM (Certbot adds the HTTPS lines on the server).
# The deploy workflow installs snippets/wind-security.conf and conf.d/wind-rate-limit.conf
# from frontend/nginx/ and adds the two marked lines below if they are missing.
server {
    listen 80;
    listen [::]:80;
    server_name wind.suryadeals.com;
    include snippets/wind-security.conf;   # added by deploy

    root /var/www/wind;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=wind_api burst=20 nodelay;   # added by deploy
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
