name: Deploy UK Wind Forecast Portal to Oracle Cloud Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Deploy to Oracle Cloud VM via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ]; then
            echo "Skipping SSH deploy: Secrets SSH_PRIVATE_KEY or SERVER_HOST not configured on this repository."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Rsync built frontend dist to /var/www/wind/
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 $USER@$HOST "sudo mkdir -p /var/www/wind && sudo chown -R $USER:$USER /var/www/wind"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ $USER@$HOST:/var/www/wind/

          # Rsync backend to /opt/wind-app/backend/
          ssh -o StrictHostKeyChecking=no $USER@$HOST "sudo mkdir -p /opt/wind-app/backend && sudo chown -R $USER:$USER /opt/wind-app"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" backend/ $USER@$HOST:/opt/wind-app/backend/
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" deploy_server.sh $USER@$HOST:/opt/wind-app/

          # Run server-side configuration and service reload
          ssh -o StrictHostKeyChecking=no $USER@$HOST "sudo bash /opt/wind-app/deploy_server.sh"
